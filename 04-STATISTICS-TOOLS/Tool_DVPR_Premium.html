<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot Execution (DVPR) | Black Belt Studio</title>
    <link rel="stylesheet" href="twilight_theme.css">
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
            overflow: hidden;
            background: #050505;
        }

        .sidebar-left {
            background: #0a0a0a;
            border-right: 1px solid var(--glass-border);
            padding: 30px;
        }

        .main-workspace {
            padding: 40px;
            overflow-y: auto;
        }

        .premium-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Inter';
        }

        .btn {
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .test-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .test-table th {
            text-align: left;
            color: #94a3b8;
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        .test-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: top;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="sidebar-left">
            <h2 style="color:#3b82f6; font-family:'Orbitron';">PILOT SUITE</h2>
            <p style="color:#94a3b8; font-size:12px;">Test, Validate, Refine.</p>
            <button class="btn" style="background:none; border:1px solid #333; margin-top:20px;"
                onclick="window.history.back()">Back</button>
        </div>
        <div class="main-workspace">
            <h1 style="font-family:'Orbitron'; color: white;">Pilot Execution Plan (DVPR)</h1>
            <p style="color:#ccc;">Design Verification Plan & Report. Ensure the solution works in the real world before
                full scale.</p>

            <button class="btn" onclick="addTest()">+ Add Test Case</button>
            <table class="test-table">
                <thead>
                    <tr>
                        <th style="width:200px;">Test Case / Scenario</th>
                        <th style="width:200px;">Acceptance Criteria</th>
                        <th style="width:150px;">Method</th>
                        <th style="width:120px;">Result</th>
                        <th>Evidence / Notes</th>
                        <th style="width:50px;"></th>
                    </tr>
                </thead>
                <tbody id="testBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        let tests = [];
        function addTest() {
            tests.push({ id: Date.now(), case: '', crit: '', method: '', res: 'pending', notes: '' });
            render();
        }
        function update(id, field, val) {
            const t = tests.find(x => x.id === id);
            if (t) { t[field] = val; render(); }
        }
        function remove(id) {
            tests = tests.filter(x => x.id !== id);
            render();
        }
        function render() {
            const tbody = document.getElementById('testBody');
            tbody.innerHTML = '';
            tests.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><textarea class="premium-input" rows="2" oninput="update(${t.id}, 'case', this.value)">${t.case}</textarea></td>
                    <td><textarea class="premium-input" rows="2" oninput="update(${t.id}, 'crit', this.value)">${t.crit}</textarea></td>
                    <td><input class="premium-input" value="${t.method}" oninput="update(${t.id}, 'method', this.value)"></td>
                    <td>
                        <select class="premium-input" onchange="update(${t.id}, 'res', this.value)" style="background:${t.res === 'pass' ? 'rgba(16,185,129,0.2)' : (t.res === 'fail' ? 'rgba(239,68,68,0.2)' : '')}">
                            <option value="pending" ${t.res === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="pass" ${t.res === 'pass' ? 'selected' : ''}>Pass</option>
                            <option value="fail" ${t.res === 'fail' ? 'selected' : ''}>Fail</option>
                        </select>
                    </td>
                    <td><textarea class="premium-input" rows="2" oninput="update(${t.id}, 'notes', this.value)">${t.notes}</textarea></td>
                    <td><button onclick="remove(${t.id})" style="color:red; background:none; border:none;">X</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
        addTest();
    </script>
</body>

</html>
