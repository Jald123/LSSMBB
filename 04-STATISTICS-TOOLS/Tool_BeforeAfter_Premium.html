<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before & After Analysis | Black Belt Studio</title>
    <link rel="stylesheet" href="twilight_theme.css">
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
            overflow: hidden;
            background: #050505;
        }

        .sidebar-left {
            background: #0a0a0a;
            border-right: 1px solid var(--glass-border);
            padding: 30px;
        }

        .main-workspace {
            padding: 40px;
            overflow-y: auto;
        }

        .premium-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Inter';
        }

        .btn {
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .comp-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .comp-table th {
            text-align: left;
            color: #94a3b8;
            padding: 10px;
            border-bottom: 1px solid #333;
        }

        .comp-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .delta-good {
            color: #10b981;
        }

        .delta-bad {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="sidebar-left">
            <h2 style="color:#3b82f6; font-family:'Orbitron';">VERIFY SUITE</h2>
            <p style="color:#94a3b8; font-size:12px;">Validate improvement results.</p>
            <button class="btn" style="background:none; border:1px solid #333; margin-top:20px;"
                onclick="window.history.back()">Back</button>
        </div>
        <div class="main-workspace">
            <h1 style="font-family:'Orbitron'; color: white;">Before / After Analysis</h1>
            <p style="color:#ccc;">Document the shift in headers KPIs and visual states.</p>

            <button class="btn" onclick="addMetric()">+ Add KPI</button>
            <table class="comp-table">
                <thead>
                    <tr>
                        <th>Metric Name</th>
                        <th>Baseline (Before)</th>
                        <th>Target</th>
                        <th>Actual (After)</th>
                        <th>Delta %</th>
                        <th>Result</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="metricBody"></tbody>
            </table>

            <div style="margin-top:40px; display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div style="background:rgba(255,255,255,0.05); padding:20px; text-align:center; border-radius:10px;">
                    <h3>📸 Before Photo</h3>
                    <div
                        style="height:200px; border:2px dashed #444; display:flex; align-items:center; justify-content:center; color:#666;">
                        Click to Upload
                    </div>
                </div>
                <div style="background:rgba(255,255,255,0.05); padding:20px; text-align:center; border-radius:10px;">
                    <h3>📸 After Photo</h3>
                    <div
                        style="height:200px; border:2px dashed #444; display:flex; align-items:center; justify-content:center; color:#666;">
                        Click to Upload
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let metrics = [];
        function addMetric() {
            metrics.push({ id: Date.now(), name: '', before: 0, target: 0, after: 0 });
            render();
        }
        function update(id, field, val) {
            const m = metrics.find(x => x.id === id);
            if (m) { m[field] = val; render(); }
        }
        function remove(id) {
            metrics = metrics.filter(x => x.id !== id);
            render();
        }
        function render() {
            const tbody = document.getElementById('metricBody');
            tbody.innerHTML = '';
            metrics.forEach(m => {
                const b = parseFloat(m.before) || 1;
                const a = parseFloat(m.after) || 0;
                const delta = ((a - b) / b) * 100;
                const isGood = a < b; // Assumes reduction is good (Lean) - naive logic suitable for template

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input class="premium-input" value="${m.name}" oninput="update(${m.id}, 'name', this.value)" placeholder="e.g. Lead Time"></td>
                    <td><input type="number" class="premium-input" value="${m.before}" oninput="update(${m.id}, 'before', this.value)"></td>
                    <td><input type="number" class="premium-input" value="${m.target}" oninput="update(${m.id}, 'target', this.value)"></td>
                    <td><input type="number" class="premium-input" value="${m.after}" oninput="update(${m.id}, 'after', this.value)"></td>
                    <td class="${isGood ? 'delta-good' : 'delta-bad'}">${delta.toFixed(1)}%</td>
                    <td>${isGood ? '✅ Improved' : '❌ Regressed'}</td>
                    <td><button onclick="remove(${m.id})" style="color:red; background:none; border:none;">X</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
        addMetric();
    </script>
</body>

</html>
