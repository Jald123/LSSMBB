<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design FMEA | Black Belt Studio</title>
    <link rel="stylesheet" href="twilight_theme.css">
    <script src="config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reuse core styles */
        .app-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
            overflow: hidden;
            background: #050505;
        }

        .sidebar-left {
            background: #0a0a0a;
            border-right: 1px solid var(--glass-border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-workspace {
            padding: 40px;
            overflow-y: auto;
        }

        .premium-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Inter';
        }

        .btn {
            background: var(--accent);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }

        .fmea-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }

        .fmea-table th {
            text-align: left;
            color: #94a3b8;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        .fmea-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .rpn-high {
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="sidebar-left">
            <h2 style="color:#3b82f6; font-family:'Orbitron';">RISK SUITE</h2>
            <p style="color:#94a3b8; font-size:12px;">Identify failures before they happen.</p>
            <button class="btn" style="background:none; border:1px solid #333;"
                onclick="window.history.back()">Back</button>
        </div>
        <div class="main-workspace">
            <h1 style="font-family:'Orbitron'; color: white;">Design FMEA (DFMEA)</h1>
            <button class="btn" onclick="addRow()">+ Add Failure Mode</button>
            <table class="fmea-table">
                <thead>
                    <tr>
                        <th>Function / Step</th>
                        <th>Failure Mode</th>
                        <th>Effect</th>
                        <th>Sev (1-10)</th>
                        <th>Occ (1-10)</th>
                        <th>Det (1-10)</th>
                        <th>RPN</th>
                        <th>Action</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="fmeaBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        let rows = [];
        function addRow() {
            rows.push({ id: Date.now(), func: '', mode: '', effect: '', s: 1, o: 1, d: 1 });
            render();
        }
        function update(id, field, val) {
            const r = rows.find(x => x.id === id);
            if (r) { r[field] = val; render(); }
        }
        function remove(id) {
            rows = rows.filter(x => x.id !== id);
            render();
        }
        function render() {
            const tbody = document.getElementById('fmeaBody');
            tbody.innerHTML = '';
            rows.forEach(r => {
                const rpn = r.s * r.o * r.d;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input class="premium-input" value="${r.func}" oninput="update(${r.id}, 'func', this.value)"></td>
                    <td><input class="premium-input" value="${r.mode}" oninput="update(${r.id}, 'mode', this.value)"></td>
                    <td><input class="premium-input" value="${r.effect}" oninput="update(${r.id}, 'effect', this.value)"></td>
                    <td><input type="number" class="premium-input" style="width:50px" value="${r.s}" oninput="update(${r.id}, 's', this.value)"></td>
                    <td><input type="number" class="premium-input" style="width:50px" value="${r.o}" oninput="update(${r.id}, 'o', this.value)"></td>
                    <td><input type="number" class="premium-input" style="width:50px" value="${r.d}" oninput="update(${r.id}, 'd', this.value)"></td>
                    <td class="${rpn > 100 ? 'rpn-high' : ''}">${rpn}</td>
                    <td><input class="premium-input" placeholder="Mitigation..."></td>
                    <td><button onclick="remove(${r.id})" style="color:red; background:none; border:none;">X</button></td>
                `;
                tbody.appendChild(tr);
            });
        }
        addRow(); // init
    </script>
</body>

</html>
